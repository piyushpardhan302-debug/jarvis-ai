<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis AI</title>
<style>
body {
  margin: 0;
  background: #07111f;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}
.container {
  padding: 40px 20px;
}
h1 {
  color: #00d9ff;
  font-size: 38px;
}
.circle {
  width: 180px;
  height: 180px;
  border: 3px solid #00d9ff;
  border-radius: 50%;
  margin: 35px auto;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 30px #00d9ff;
  font-size: 30px;
}
button {
  background: #00bcd4;
  border: none;
  border-radius: 25px;
  padding: 15px 25px;
  font-size: 17px;
  margin: 8px;
  cursor: pointer;
}
#output {
  margin: 25px auto;
  max-width: 500px;
  line-height: 1.6;
}
</style>
</head>
<body>
<div class="container">
  <h1>JARVIS AI</h1>
  <p>Your Personal AI Assistant</p>
  <div class="circle">J.A.R.V.I.S</div>
  <button onclick="startJarvis()">🎤 Talk to Jarvis</button>
  <div id="output">Hello! I am Jarvis. How can I help you?</div>
</div>

<script>

function startJarvis() {
  const output = document.getElementById("output");

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    output.innerText = "Please use Google Chrome.";
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = "hi-IN";
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onresult = function(event) {
    const text = event.results[0][0].transcript;
    const command = text.toLowerCase().trim();

    output.innerText = "आपने कहा: " + text;

    let reply = "माफ कीजिए Sir, यह कमांड अभी मुझे नहीं आती।";

    if (
      command.includes("hello") ||
      command.includes("हेलो") ||
      command.includes("नमस्ते") ||
      command.includes("हाय")
    ) {
      reply = "Hello Sir! आपका JARVIS तैयार है।";
    }
    else if (
      command.includes("नाम") ||
      command.includes("your name")
    ) {
      reply = "मेरा नाम JARVIS है।";
    }
    else if (
      command.includes("समय") ||
      command.includes("टाइम") ||
      command.includes("time")
    ) {
      reply = "अभी समय है " +
        new Date().toLocaleTimeString("hi-IN");
    }
    else if (
      command.includes("तारीख") ||
      command.includes("डेट") ||
      command.includes("date")
    ) {
      reply = "आज की तारीख है " +
        new Date().toLocaleDateString("hi-IN");
    }
    else if (
      command.includes("कैसे हो") ||
      command.includes("how are you")
    ) {
      reply = "मैं बिल्कुल ठीक हूँ Sir! आपका JARVIS तैयार है।";
    }
    else if (
      command.includes("गूगल खोलो") ||
      command.includes("open google")
    ) {
      reply = "जी Sir, Google खोल रहा हूँ।";
      window.open("https://www.google.com", "_blank");
    }
    else if (
      command.includes("यूट्यूब खोलो") ||
      command.includes("open youtube")
    ) {
      reply = "जी Sir, YouTube खोल रहा हूँ।";
      window.open("https://www.youtube.com", "_blank");
    }

    output.innerText = "JARVIS: " + reply;

    const speech = new SpeechSynthesisUtterance(reply);
    speech.lang = "hi-IN";
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(speech);
  };

  recognition.onerror = function(event) {
    output.innerText = "माइक्रोफोन की अनुमति चेक करें: " + event.error;
  };

  recognition.start();
}
  
</script>
</body>
</html>
