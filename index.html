
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS AI</title>

<style>
body {
  margin: 0;
  background: #07111f;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}
.container { padding: 30px 18px; }
h1 {
  color: #00d9ff;
  font-size: 38px;
}
.circle {
  width: 180px;
  height: 180px;
  border: 3px solid #00d9ff;
  border-radius: 50%;
  margin: 30px auto;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 30px #00d9ff;
  font-size: 27px;
}
button {
  background: #00bcd4;
  border: none;
  border-radius: 25px;
  padding: 14px 22px;
  font-size: 16px;
  margin: 8px;
  cursor: pointer;
}
input {
  width: 85%;
  max-width: 450px;
  padding: 14px;
  border-radius: 12px;
  border: 1px solid #00d9ff;
  background: #102238;
  color: white;
  font-size: 16px;
}
#output {
  margin: 22px auto;
  max-width: 500px;
  line-height: 1.6;
  overflow-wrap: anywhere;
}
</style>
</head>

<body>
<div class="container">
  <h1>JARVIS AI</h1>
  <p>Your Personal AI Assistant</p>

  <div class="circle">J.A.R.V.I.S</div>

  <button onclick="startJarvis()">🎤 Talk to Jarvis</button>

  <div>
    <input id="question" placeholder="अपना सवाल यहाँ लिखें...">
    <br>
    <button onclick="askJarvis()">Send to JARVIS</button>
  </div>

  <div id="output">Hello Sir! आपका JARVIS AI तैयार है।</div>
</div>

<script>
const WORKER_URL =
"https://dry-darkness-2c3a.piyushpardhan302.workers.dev/";

const output = document.getElementById("output");

async function askAI(message) {
  output.innerText = "JARVIS सोच रहा है...";

  try {
    const response = await fetch(WORKER_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: message
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "AI से जवाब नहीं मिला");
    }

    const reply = data.reply || "मुझे जवाब नहीं मिला।";

    output.innerText = "आपने पूछा: " + message +
                       "\n\nJARVIS: " + reply;

    speak(reply);

  } catch (error) {
    output.innerText =
      "JARVIS से कनेक्शन नहीं हो पाया। " + error.message;
  }
}

function speak(text) {
  if (!("speechSynthesis" in window)) return;

  window.speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(text);
  speech.lang = "hi-IN";
  speech.rate = 1;

  window.speechSynthesis.speak(speech);
}

function askJarvis() {
  const question =
    document.getElementById("question").value.trim();

  if (!question) {
    output.innerText = "पहले अपना सवाल लिखिए Sir।";
    return;
  }

  askAI(question);
}

function startJarvis() {
  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    output.innerText =
      "आवाज़ पहचानने के लिए Chrome इस्तेमाल करें। आप सवाल लिख भी सकते हैं।";
    return;
  }

  const recognition = new SpeechRecognition();

  recognition.lang = "hi-IN";
  recognition.continuous = false;
  recognition.interimResults = false;

  output.innerText = "JARVIS सुन रहा है...";

  recognition.onresult = function(event) {
    const text = event.results[0][0].transcript;

    output.innerText = "आपने कहा: " + text;
    askAI(text);
  };

  recognition.onerror = function(event) {
    output.innerText =
      "माइक्रोफोन की अनुमति चेक करें: " + event.error;
  };

  recognition.start();
}
</script>
</body>
</html>
